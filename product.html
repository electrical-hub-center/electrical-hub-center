<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Details</title>

<style>
body{
  font-family:Arial;
  background:#0f2027;
  color:white;
  margin:0;
}

/* IMAGE */
.product-img{
  width:100%;
  height:250px;
  object-fit:cover;
}

/* BOX */
.container{
  padding:15px;
}

/* READ MORE */
.desc{
  max-height:60px;
  overflow:hidden;
  transition:0.3s;
}

.desc.active{
  max-height:300px;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00c6ff;
  color:white;
  margin-top:10px;
}

/* DETAILS BOX */
.details{
  background:rgba(255,255,255,0.1);
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}
</style>

</head>

<body>

<img id="pImage" class="product-img">

<div class="container">

<h2 id="pName"></h2>
<h3 id="pPrice"></h3>

<!-- DESCRIPTION -->
<p id="pDesc" class="desc"></p>
<button onclick="toggleDesc()">Read More</button>

<!-- ADDITIONAL DETAILS -->
<div class="details">
  <p><b>Generic Name:</b> <span id="gName"></span></p>
  <p><b>Country:</b> <span id="country"></span></p>
  <p><b>Brand:</b> <span id="brand"></span></p>
</div>

<!-- ORDER -->
<button onclick="orderNow()">🛒 Order Now</button>

</div>

<script>

let product = JSON.parse(localStorage.getItem("selectedProduct"));

// LOAD DATA
document.getElementById("pImage").src = product.images ? product.images[0] : product.image;
document.getElementById("pName").innerText = product.name;
document.getElementById("pPrice").innerText = "₹" + product.price;
document.getElementById("pDesc").innerText = product.desc;

// ADDITIONAL DETAILS (custom field)
document.getElementById("gName").innerText = product.generic || "N/A";
document.getElementById("country").innerText = product.country || "India";
document.getElementById("brand").innerText = product.brand || "Generic";

// READ MORE
function toggleDesc(){
  let d = document.getElementById("pDesc");
  d.classList.toggle("active");
}

// ORDER
function orderNow(){
  let msg = `Order:
Product: ${product.name}
Price: ₹${product.price}`;

  window.open("https://wa.me/919434852965?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
